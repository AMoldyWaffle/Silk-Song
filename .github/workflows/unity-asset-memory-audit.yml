name: Unity Asset Memory Audit

on:
  push:
    branches:
      - memory-audit-and-safe-optimizations
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check UnityPy requests
      - name: Inspect Addressables bundles
        run: python tools/analyze_unity_bundles.py
      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: unity-memory-audit
          path: audit-report/
          if-no-files-found: error
          retention-days: 14
